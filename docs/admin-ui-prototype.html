<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Migration Hub Prototype</title>
<style>
/* Layout: Shopify-admin frame (dark top bar, left nav) around one app column; the Home "journey card" is the spine of the flow. */
:root {
  --brand: #0b5368; --brand-hover: #083f50; --brand-soft: #e6f1f4; --brand-line: #b9d6df;
  --canvas: #f1f2f4; --surface: #ffffff; --surface-sub: #f7f7f7; --surface-hover: #f3f3f3;
  --line: #e3e3e3; --line-strong: #c9cccf;
  --text: #303030; --strong: #1a1a1a; --muted: #616161; --subtle: #8a8a8a;
  --primary: #303030; --primary-hover: #1a1a1a; --on-primary: #ffffff;
  --success: #0c7a43; --success-bg: #cdfee1; --success-soft: #eafbf1;
  --info: #00527c; --info-bg: #e0f0ff;
  --warning: #8a6116; --warning-bg: #ffef9d; --warning-soft: #fff8db;
  --critical: #b3261e; --critical-bg: #fee9e8; --critical-soft: #fff4f4;
  --neutral-bg: #ebebeb;
  --topbar: #1a1a1a; --topbar-text: #e3e3e3; --topbar-field: #303030;
  --side: #ebebeb; --side-active: #ffffff;
  --overlay: rgba(0,0,0,.45);
  --shadow-card: 0 1px 0 rgba(26,26,26,.07), inset 0 0 0 1px rgba(0,0,0,.06);
  --shadow-raised: 0 8px 24px rgba(26,26,26,.16), inset 0 0 0 1px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-sm: 8px; --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand: #5fb3c9; --brand-hover: #7cc6d9; --brand-soft: #12313a; --brand-line: #285866;
  --canvas: #141617; --surface: #1f2224; --surface-sub: #262a2c; --surface-hover: #2b3033;
  --line: #34393c; --line-strong: #4a5054;
  --text: #e3e5e7; --strong: #ffffff; --muted: #a6acb0; --subtle: #80878b;
  --primary: #e3e5e7; --primary-hover: #ffffff; --on-primary: #1a1a1a;
  --success: #4fd18b; --success-bg: #0f3a24; --success-soft: #11291c;
  --info: #7cc4ff; --info-bg: #0f2a40;
  --warning: #f0c35a; --warning-bg: #3d300d; --warning-soft: #2b2310;
  --critical: #ff8a80; --critical-bg: #3e1715; --critical-soft: #2c1413;
  --neutral-bg: #34393c;
  --topbar: #0c0d0e; --topbar-field: #232628;
  --side: #191b1c; --side-active: #26292b;
  --overlay: rgba(0,0,0,.6);
  --shadow-card: inset 0 0 0 1px rgba(255,255,255,.07);
  --shadow-raised: 0 8px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --brand: #5fb3c9; --brand-hover: #7cc6d9; --brand-soft: #12313a; --brand-line: #285866;
  --canvas: #141617; --surface: #1f2224; --surface-sub: #262a2c; --surface-hover: #2b3033;
  --line: #34393c; --line-strong: #4a5054;
  --text: #e3e5e7; --strong: #ffffff; --muted: #a6acb0; --subtle: #80878b;
  --primary: #e3e5e7; --primary-hover: #ffffff; --on-primary: #1a1a1a;
  --success: #4fd18b; --success-bg: #0f3a24; --success-soft: #11291c;
  --info: #7cc4ff; --info-bg: #0f2a40;
  --warning: #f0c35a; --warning-bg: #3d300d; --warning-soft: #2b2310;
  --critical: #ff8a80; --critical-bg: #3e1715; --critical-soft: #2c1413;
  --neutral-bg: #34393c;
  --topbar: #0c0d0e; --topbar-field: #232628;
  --side: #191b1c; --side-active: #26292b;
  --overlay: rgba(0,0,0,.6);
  --shadow-card: inset 0 0 0 1px rgba(255,255,255,.07);
  --shadow-raised: 0 8px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--text); font: 14.5px/1.5 var(--font); }
/* plain-language helpers */
.reassure { display: flex; gap: 8px 20px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.reassure span { display: inline-flex; align-items: center; gap: 6px; }
.reassure svg { color: var(--success); }
.next { border-radius: var(--r-sm); background: var(--surface-sub); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 14px; }
.next__title { font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.next ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.jstep__now { display: block; font-size: 12px; font-weight: 500; color: var(--brand); }
.howto { border-radius: var(--r-sm); background: var(--brand-soft); padding: 0; }
.howto summary { cursor: pointer; padding: 10px 12px; font-weight: 600; color: var(--brand); list-style: none; display: flex; align-items: center; gap: 6px; }
.howto summary::-webkit-details-marker { display: none; }
.howto ol { margin: 0; padding: 0 14px 12px 34px; display: flex; flex-direction: column; gap: 4px; }
.summary-line { font-size: 16px; color: var(--strong); font-weight: 600; }

/* ---------- migrations: overview, live run, run history ---------- */
.mg-over { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.mg-route { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; border-right: 1px solid var(--line); background: radial-gradient(90% 120% at 0% 0%, var(--brand-soft) 0%, transparent 55%), var(--surface); border-radius: var(--r) 0 0 var(--r); }
.mg-route .welcome__path { justify-self: center; }
.mg-route .welcome__path span { box-shadow: 0 0 0 2px var(--surface); }
.mg-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mg-stat { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px; min-width: 0; border-left: 1px solid var(--line); }
.mg-stat:nth-child(odd) { border-left: 0; }
.mg-stat:nth-child(n+3) { border-top: 1px solid var(--line); }
.mg-stat__label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
.mg-stat__value { font-size: 22px; font-weight: 700; color: var(--strong); letter-spacing: -.01em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.mg-stat__value--ok { color: var(--success); }
.mg-stat__value--bad { color: var(--critical); }
.mg-stat__foot { color: var(--subtle); font-size: 12px; }
@media (max-width: 900px) {
  .mg-over { grid-template-columns: minmax(0, 1fr); }
  .mg-route { border-right: 0; border-bottom: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; }
}
@media (max-width: 560px) {
  .mg-route { grid-template-columns: minmax(0, 1fr); } .mg-route .welcome__path { display: none; }
  .mg-route .rv-node--to { flex-direction: row; text-align: left; } .mg-route .rv-node--to .rv-ok { justify-content: flex-start; }
}

/* a run in progress, or a draft waiting to be finished */
.live { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 14px 16px; }
.live__icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--info-bg); color: var(--info); grid-row: 1 / 3; }
.live__icon--draft { background: var(--neutral-bg); color: var(--muted); }
.live__icon svg { width: 20px; height: 20px; }
.live__title { grid-column: 2; grid-row: 1; font-weight: 650; color: var(--strong); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live__meter { grid-column: 2; grid-row: 2; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.live__meter .progress { flex: 1; }
.live .btn { grid-column: 3; grid-row: 1 / 3; }
@media (max-width: 560px) { .live { grid-template-columns: 40px minmax(0, 1fr); } .live .btn { grid-column: 2; grid-row: 3; justify-self: start; } }

/* run history: one row per finished run */
.runs { display: flex; flex-direction: column; }
.run { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(150px, 210px) auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.run:hover { background: var(--surface-sub); }
.run:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.run__icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.run__icon--ok { background: var(--success-soft); color: var(--success); }
.run__icon--warn { background: var(--warning-soft); color: var(--warning); }
.run__icon svg { width: 20px; height: 20px; }
.run__text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.run__title { font-weight: 650; color: var(--strong); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.run__meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 0; }
.run__meta span + span::before { content: "·"; margin: 0 6px; color: var(--subtle); }
.run__meter { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); min-width: 0; }
.run__meter b { color: var(--strong); font-weight: 650; font-variant-numeric: tabular-nums; }
.run__bar { display: flex; height: 6px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; }
.run__bar span { display: block; height: 100%; background: var(--success); }
.run__bar span + span { background: var(--critical); }
.run__actions { display: flex; gap: 6px; justify-content: flex-end; }
.runs__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--surface-sub); border-radius: 0 0 var(--r) var(--r); color: var(--muted); font-size: 12.5px; }
@media (max-width: 760px) {
  .run { grid-template-columns: 40px minmax(0, 1fr); }
  .run__meter, .run__actions { grid-column: 2; }
  .run__actions { justify-content: flex-start; }
}

/* ---------- dashboard ---------- */
/* chart series: validated categorical order (adjacent CVD ΔE ≥ 8.4 in both modes) */
:root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --grid: #ebebeb; --tip: #1a1a1a; --tip-text: #ffffff; --area-alpha: .3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --grid: #30353a; --tip: #f1f2f4; --tip-text: #1a1a1a; --area-alpha: .38; } }
:root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --grid: #30353a; --tip: #f1f2f4; --tip-text: #1a1a1a; --area-alpha: .38; }

.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--neutral-bg); gap: 2px; }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s; }
.seg button:hover { color: var(--strong); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--strong); box-shadow: var(--shadow-card); }
.seg button:focus-visible { outline: 2px solid var(--brand); }
.dash-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dash-filters .select { width: auto; min-width: 190px; }

.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi__label { color: var(--muted); font-size: 13px; font-weight: 550; }
.kpi__value { font-size: 26px; font-weight: 700; color: var(--strong); letter-spacing: -.01em; }
.kpi__foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 4px 8px; margin-top: 4px; flex-wrap: wrap; }
.kpi__delta { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.kpi__delta--up { color: var(--success); }
.kpi__delta--down { color: var(--critical); }
.kpi__spark { flex: none; }
.kpi--hero .kpi__value { font-size: 34px; }

.dgrid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; width: 100%; }
.dgrid--even { grid-template-columns: repeat(2, minmax(0, 1fr));  }
@media (max-width: 900px) { .dgrid, .dgrid--even { grid-template-columns: minmax(0, 1fr); } }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 16px 16px 0; }
.card__head p { color: var(--muted); font-size: 13px; }
/* the "records over time" card: a fixed-height body, so switching views never moves the page */
.chart-card__head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; padding: 16px 16px 0; }
.chart-card__head p { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .chart-card__head { grid-template-columns: minmax(0, 1fr); } }
.chart-body { position: relative; height: 296px; min-width: 0; }
.chart-view { position: absolute; inset: 0; display: flex; flex-direction: column; animation: chartIn .28s cubic-bezier(.2,.7,.2,1) both; }
@keyframes chartIn { from { opacity: 0; transform: translateY(6px); } }
.chart-main { flex: 1; min-height: 0; min-width: 0; }
.chart-foot { flex: none; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; padding: 8px 16px 12px; color: var(--muted); font-size: 12.5px; }
.chart-foot strong { color: var(--strong); font-weight: 650; }
.chart { padding: 10px 16px 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .axis-line { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--line-strong); }
.chart .cap-label { fill: var(--strong); font-size: 11.5px; font-weight: 650; }
/* columns grow up from the baseline, one after another */
.chart .col { transform-box: fill-box; transform-origin: 50% 100%; animation: colGrow .5s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i, 0) * 14ms); transition: opacity .15s; }
@keyframes colGrow { from { transform: scaleY(0); } }
.chart .col.dim { opacity: .3; }
/* the running total is revealed left to right */
.chart .reveal { transform-box: fill-box; transform-origin: 0 50%; animation: revealX .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes revealX { from { transform: scaleX(0); } }
.chart .band { fill-opacity: var(--area-alpha); }
.chart .band-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart [data-s] { transition: opacity .15s; }
/* legend hover: spotlight one series */
.chart-card[data-focus] .chart [data-s] { opacity: .12; }
.chart-card[data-focus="products"] .chart [data-s="products"], .chart-card[data-focus="customers"] .chart [data-s="customers"],
.chart-card[data-focus="orders"] .chart [data-s="orders"], .chart-card[data-focus="other"] .chart [data-s="other"] { opacity: 1; }
.chart-card[data-focus="products"] .dash-table [data-s="products"], .chart-card[data-focus="customers"] .dash-table [data-s="customers"],
.chart-card[data-focus="orders"] .dash-table [data-s="orders"], .chart-card[data-focus="other"] .dash-table [data-s="other"] { background: var(--brand-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 8px 12px 0; font-size: 12.5px; color: var(--text); }
.legend span { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: default; transition: background .15s; }
.legend span:hover { background: var(--surface-hover); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.hbars { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; }
.hbar { display: grid; grid-template-columns: 116px minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; cursor: default; }
.hbar__track { height: 10px; border-radius: 0 4px 4px 0; background: var(--neutral-bg); overflow: hidden; }
.hbar__fill { height: 100%; border-radius: 0 4px 4px 0; transition: width .3s; }
.hbar__val { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--strong); min-width: 52px; text-align: right; }
.hbar:hover .hbar__track { box-shadow: 0 0 0 2px var(--brand-soft); }

.health { display: flex; gap: 2px; height: 14px; margin: 14px 16px 10px; }
.health span { display: block; height: 100%; }
.health span:first-child { border-radius: 4px 0 0 4px; }
.health span:last-child { border-radius: 0 4px 4px 0; }
.health-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px; }
.health-keys div { display: flex; flex-direction: column; gap: 2px; }
.health-keys strong { font-size: 18px; color: var(--strong); font-variant-numeric: tabular-nums; }
.health-keys span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.health-keys i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.feed { list-style: none; margin: 0; padding: 6px 16px 12px; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.feed__icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.feed__icon--ok { background: var(--success-soft); color: var(--success); }
.feed__icon--warn { background: var(--warning-soft); color: var(--warning); }
.feed__text strong { color: var(--strong); font-weight: 600; }
.feed__time { color: var(--subtle); font-size: 12.5px; white-space: nowrap; }
.dash-table { overflow: auto; padding: 4px 16px 0; }
.dash-table table { font-size: 13px; }
.dash-table td, .dash-table th { padding: 7px 10px; }
.dash-table thead th { position: sticky; top: 0; z-index: 1; }
.dash-table tfoot th { position: sticky; bottom: 0; font-size: 13px; color: var(--strong); background: var(--surface-sub); border-top: 1px solid var(--line); border-bottom: 0; }
.dash-table tbody tr:hover td { background: var(--surface-sub); }
#vtip { position: fixed; z-index: 70; pointer-events: none; background: var(--tip); color: var(--tip-text); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 18px rgba(0,0,0,.18); opacity: 0; transition: opacity .1s; max-width: 240px; }
#vtip.show { opacity: 1; }
#vtip .row { gap: 14px; flex-wrap: nowrap; justify-content: space-between; }
#vtip .row > span { display: inline-flex; align-items: center; gap: 6px; }
#vtip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
#vtip b { font-variant-numeric: tabular-nums; }
#vtip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
#vtip b { font-variant-numeric: tabular-nums; }

/* new-migration choice dialog */
.choice { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line-strong); }
.choice:hover { background: var(--surface-hover); }
.choice:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.choice--primary { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); }
.choice--primary:hover { background: var(--brand-soft); filter: brightness(.98); }
.choice__title { font-weight: 650; color: var(--strong); }
.choice__body { color: var(--muted); font-size: 13px; line-height: 1.45; }

/* alignment helpers */
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.wiz-title { font-size: 16px; }
.tile__text { display: flex; flex-direction: column; min-width: 0; }
.tile__logo.tile__logo--xs { width: auto; min-width: 24px; height: 22px; padding-inline: 5px; border-radius: 6px; font-size: 10.5px; }
.check__label { display: block; }
.check > span { display: flex; flex-direction: column; min-width: 0; }
.jstep__label { display: flex; flex-direction: column; min-width: 0; }
.banner .btn { flex: none; align-self: center; }
.checklist .btn { flex: none; }
.facts > div { min-width: 0; }
.kv dd { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .checklist li { flex-wrap: wrap; }
  .checklist .btn { margin-left: 30px; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .banner { flex-wrap: wrap; }
}
button { font: inherit; color: inherit; }
h1, h2, h3 { color: var(--strong); margin: 0; text-wrap: balance; }
p { margin: 0; }
.num, td.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---------- admin frame ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; height: 52px; padding-inline: 16px; background: var(--topbar); color: var(--topbar-text); }
.topbar__mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; color: #fff; flex: none; }
.topbar__search { flex: 1; max-width: 520px; margin-inline: auto; height: 32px; border-radius: 9px; background: var(--topbar-field); color: #9aa0a4; display: flex; align-items: center; gap: 8px; padding-inline: 12px; font-size: 13px; min-width: 0; overflow: hidden; white-space: nowrap; }
.topbar__store { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.topbar__avatar { width: 28px; height: 28px; border-radius: 8px; background: #3d8a5f; color: #fff; display: grid; place-items: center; font-weight: 650; font-size: 12px; }
.admin { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.side { background: var(--side); padding: 10px 8px 24px; display: flex; flex-direction: column; gap: 1px; }
.side__item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--muted); font-weight: 550; font-size: 13px; }
.side__item svg { opacity: .7; }
.side__label { margin: 14px 10px 4px; font-size: 12px; color: var(--subtle); font-weight: 600; }
.side__app { color: var(--strong); background: var(--side-active); box-shadow: var(--shadow-card); }
.side__sub { display: flex; flex-direction: column; gap: 1px; padding: 4px 0 4px 26px; }
.side__link { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; color: var(--muted); font-weight: 550; font-size: 13px; }
.side__link:hover { background: var(--surface-hover); color: var(--strong); }
.side__link[aria-current="page"] { color: var(--strong); background: var(--side-active); }
.side__link:focus-visible { outline: 2px solid var(--brand); }

.apptabs { display: none; gap: 4px; overflow-x: auto; padding: 8px 0 4px; margin-bottom: 4px; }
.apptabs button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-card); font-weight: 550; white-space: nowrap; }
.apptabs button[aria-current="page"] { background: var(--primary); color: var(--on-primary); }

main { padding: 20px 24px 48px; min-width: 0; }
.page { max-width: 1000px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.page--narrow { max-width: 980px; }

@media (max-width: 760px) {
  .admin { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .apptabs { display: flex; }
  main { padding: 8px 16px 40px; }
  .topbar__search { display: none; }
  .topbar__store span.hide-sm { display: none; }
  .topbar { justify-content: space-between; }
}

/* ---------- primitives ---------- */
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.page-header__sub { color: var(--muted); margin-top: 2px; }
.back { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 550; font-size: 13px; }
.back:hover { color: var(--strong); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row--end { justify-content: flex-end; }
.row--between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-card); }
.card__sec { padding: 16px; }
.card__sec + .card__sec { border-top: 1px solid var(--line); }
.card__title { font-size: 14px; font-weight: 650; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 8px 14px; border: 0; border-radius: var(--r-sm); background: var(--surface); color: var(--strong); font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line-strong), 0 1px 0 rgba(0,0,0,.05); white-space: nowrap; }
.btn:hover { background: var(--surface-hover); }
.btn--primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.btn--primary:hover { background: var(--primary-hover); }
.btn--critical { background: var(--critical); color: #fff; box-shadow: none; }
.btn--critical:hover { background: var(--critical); filter: brightness(.92); }
.btn--plain { background: none; box-shadow: none; color: var(--brand); padding-inline: 6px; }
.btn--plain:hover { background: var(--brand-soft); }
.btn--plain-critical { color: var(--critical); }
.btn--plain-critical:hover { background: var(--critical-soft); }
.btn--sm { min-height: 30px; padding: 5px 11px; font-size: 13px; }
/* plan pill: the plan and how much of it is used, in the page header; click opens Plans */
.plan-pill { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: var(--r-sm); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong), 0 1px 0 rgba(0,0,0,.05); font-size: 13px; color: var(--muted); white-space: nowrap; transition: background .15s; }
.plan-pill:hover { background: var(--surface-hover); }
.plan-pill:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.plan-pill strong { color: var(--strong); font-weight: 650; }
.plan-pill__sep { width: 1px; height: 16px; background: var(--line); }
.plan-pill__meter { width: 56px; height: 5px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; }
.plan-pill__meter span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
.plan-pill--warn .plan-pill__meter span { background: var(--warning); }
.plan-pill--over .plan-pill__meter span { background: var(--critical); }
.plan-pill--over .num { color: var(--critical); }
.plan-pill__link { color: var(--brand); font-weight: 600; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.is-loading { color: transparent !important; position: relative; pointer-events: none; }
.btn.is-loading::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.link { all: unset; cursor: pointer; color: var(--brand); font-weight: 550; text-decoration: underline; text-underline-offset: 2px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--neutral-bg); color: var(--text); white-space: nowrap; }
.badge--success { background: var(--success-bg); color: var(--success); }
.badge--info { background: var(--info-bg); color: var(--info); }
.badge--warning { background: var(--warning-bg); color: var(--warning); }
.badge--critical { background: var(--critical-bg); color: var(--critical); }
.badge--brand { background: var(--brand-soft); color: var(--brand); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pulse .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); }
.banner--info { background: var(--info-bg); color: var(--text); }
.banner--success { background: var(--success-soft); box-shadow: inset 0 0 0 1px var(--success-bg); }
.banner--warning { background: var(--warning-soft); box-shadow: inset 0 0 0 1px var(--warning-bg); }
.banner--brand { background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand-line); }
.banner > svg { flex: none; margin-top: 1px; }
.banner__body { flex: 1; min-width: 0; }

.progress { height: 8px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; }
.progress--thin { height: 5px; }
.progress span { display: block; height: 100%; background: var(--brand); border-radius: inherit; transition: width .2s; }
.progress--success span { background: var(--success); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 16px; background: var(--surface-sub); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-hover); }
th.num, td.num { text-align: right; }
.t2 { display: block; color: var(--muted); font-size: 12.5px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 550; }
.input, .select { width: 100%; min-height: 34px; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; }
.input--mono { font-family: var(--mono); font-size: 12.5px; }
.input:focus, .select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.help { color: var(--muted); font-size: 12.5px; }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--brand); }
input[type="radio"], input[type="checkbox"] { accent-color: var(--brand); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat__label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
.stat__value { font-size: 22px; font-weight: 700; color: var(--strong); font-variant-numeric: tabular-nums; }
.stat__value--critical { color: var(--critical); }
.stat__value--success { color: var(--success); }

/* ---------- journey (home) ---------- */
.journey { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.journey__steps { list-style: none; margin: 0; padding: 12px; border-right: 1px solid var(--line); background: var(--surface-sub); border-radius: var(--r) 0 0 var(--r); display: flex; flex-direction: column; gap: 2px; }
.jstep { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: var(--subtle); font-weight: 550; }
.jstep__mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.jstep--done { color: var(--muted); }
.jstep--done .jstep__mark { background: var(--success); color: #fff; box-shadow: none; }
.jstep--current { color: var(--strong); background: var(--surface); box-shadow: var(--shadow-card); }
.jstep--current .jstep__mark { background: var(--brand); color: #fff; box-shadow: none; }
.journey__panel { padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--brand); }
.journey__title { font-size: 20px; font-weight: 700; }
.journey__body { color: var(--muted); max-width: 60ch; }
.journey__meter { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.journey__meter .progress { flex: 1; }
.facts { display: flex; gap: 20px; flex-wrap: wrap; }
.facts div { display: flex; flex-direction: column; }
.facts strong { font-size: 15px; color: var(--strong); font-variant-numeric: tabular-nums; }
.facts span { color: var(--muted); font-size: 12.5px; }
@media (max-width: 760px) {
  .journey { grid-template-columns: minmax(0, 1fr); }
  .journey__steps { border-right: 0; border-bottom: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; flex-direction: row; overflow-x: auto; }
  .jstep { flex: none; }
  .jstep:not(.jstep--current) .jstep__label { display: none; }
  .journey__panel { padding: 18px 16px; }
}

/* checklist */
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.checklist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.checklist li:first-child { border-top: 0; }
.checklist input { width: 18px; height: 18px; flex: none; }
.checklist__text { flex: 1; min-width: 0; }
.checklist__text strong { display: block; color: var(--strong); font-weight: 600; }
.checklist li.done .checklist__text strong { text-decoration: line-through; color: var(--muted); }

/* ---------- wizard ---------- */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; }
.stepper li { flex: 1; display: flex; flex-direction: column; gap: 6px; font-weight: 600; color: var(--subtle); font-size: 12.5px; }
.stepper li::before { content: ""; height: 4px; border-radius: 999px; background: var(--neutral-bg); }
.stepper li.done { color: var(--muted); }
.stepper li.done::before { background: var(--success); }
.stepper li.current { color: var(--strong); }
.stepper li.current::before { background: var(--brand); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 460px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { position: relative; display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: pointer; }
.tile input { position: absolute; opacity: 0; }
.tile:has(input:checked) { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); }
.tile:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
.tile--off { opacity: .5; cursor: not-allowed; }
.tile__logo { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 750; color: #fff; flex: none; font-size: 13px; }
.tile__name { font-weight: 650; color: var(--strong); display: block; }
.scan { border-radius: var(--r-sm); background: var(--surface-sub); box-shadow: inset 0 0 0 1px var(--line); padding: 14px; min-height: 100%; }
.scan__empty { height: 100%; min-height: 180px; display: grid; place-items: center; text-align: center; color: var(--muted); }
.scan ul { list-style: none; margin: 8px 0 0; padding: 0; }
.scan li { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.scan li:first-child { border-top: 0; }
.ok { color: var(--success); font-weight: 650; display: flex; align-items: center; gap: 6px; }
.pick { display: flex; flex-direction: column; }
.pick__row { border-top: 1px solid var(--line); }
.pick__row:first-child { border-top: 0; }
.pick__main { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
.pick__main:hover { background: var(--surface-hover); }
.pick__main input { width: 16px; height: 16px; flex: none; margin: 0; }
.pick__text { flex: 1; min-width: 0; }
.pick__summary { display: block; font-size: 12.5px; color: var(--brand); font-weight: 550; margin-top: 1px; }
.pick__sub { margin: 0 16px 14px 44px; padding: 12px 14px; border: 0; border-radius: var(--r-sm); background: var(--surface-sub); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.pick__subhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.pick__subhead .btn { text-transform: none; letter-spacing: 0; }
.pick__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; }
.pick__grid .check input { width: 15px; height: 15px; flex: none; margin: 2px 0 0; }
.pick__grid .check input:disabled + span { opacity: .75; }
@media (max-width: 560px) { .pick__sub { margin-left: 16px; } .pick__grid { grid-template-columns: minmax(0, 1fr); } }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.pick__name { font-weight: 600; color: var(--strong); }
.pick__count { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; color: var(--strong); }
details.adv > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; font-weight: 650; color: var(--strong); }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary .chev { transition: transform .15s; }
details.adv[open] > summary .chev { transform: rotate(180deg); }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; padding: 4px 16px 16px; }
@media (max-width: 640px) { .opt-grid { grid-template-columns: minmax(0, 1fr); } }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt__label { font-weight: 600; color: var(--strong); }
.radios { display: flex; gap: 14px; flex-wrap: wrap; }
.radios label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.footer-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 16px; border-top: 1px solid var(--line); }

/* ---------- wizard step 3, "Review and run": route panel, headline figures, one tile per data type ---------- */
.rv-route { margin: 0 16px 14px; padding: 16px 18px; border-radius: var(--r); background: radial-gradient(100% 140% at 100% 0%, var(--brand-soft) 0%, transparent 55%), var(--surface-sub); box-shadow: inset 0 0 0 1px var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.rv-route .welcome__path { justify-self: center; }
.rv-node { display: flex; align-items: center; gap: 12px; min-width: 0; }
.rv-node--to { flex-direction: row-reverse; text-align: right; }
.rv-node i { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; font-style: normal; font-weight: 700; font-size: 13px; color: #fff; box-shadow: var(--shadow-card); }
.rv-node i svg { width: 22px; height: 22px; }
.rv-node__shop { background: var(--brand); }
.rv-node > span { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.rv-node strong { color: var(--strong); font-weight: 650; }
.rv-node small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-node .rv-ok { color: var(--success); display: inline-flex; align-items: center; gap: 4px; }
.rv-node--to .rv-ok { justify-content: flex-end; }
.rv-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px 6px; }
.rv-stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.rv-stat__label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
.rv-stat__value { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 22px; font-weight: 700; color: var(--strong); letter-spacing: -.01em; line-height: 1.2; }
.rv-stat__foot { color: var(--subtle); font-size: 12.5px; }
.rv-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px 8px; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.rv-head .btn { text-transform: none; letter-spacing: 0; }
.rv-data { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px 16px; }
.rv-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line); }
.rv-item__icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); grid-row: 1 / 3; }
.rv-item__icon svg { width: 18px; height: 18px; }
.rv-item__name { font-weight: 600; color: var(--strong); min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.rv-item__name small { font-weight: 500; color: var(--muted); font-size: 12px; }
.rv-item__count { font-weight: 700; color: var(--strong); font-size: 15px; }
.rv-item__bar { grid-column: 2 / 4; height: 4px; border-radius: 999px; background: var(--neutral-bg); margin-top: 8px; overflow: hidden; }
.rv-item__bar span { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.rv-demo { margin: 0 16px 16px; }
@media (max-width: 640px) {
  .rv-route { grid-template-columns: minmax(0, 1fr); } .rv-route .welcome__path { display: none; }
  .rv-node--to { flex-direction: row; text-align: left; } .rv-node--to .rv-ok { justify-content: flex-start; }
  .rv-stats, .rv-data { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- progress ---------- */
.ent { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.ent:first-child { border-top: 0; }
.ent__icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--subtle); }
.ent--done .ent__icon { background: var(--success); color: #fff; box-shadow: none; }
.ent--active .ent__icon { box-shadow: inset 0 0 0 2px var(--brand); color: var(--brand); }
.ent__name { font-weight: 600; color: var(--strong); }
.ent--wait .ent__name { color: var(--muted); font-weight: 550; }
.ent__count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; text-align: right; }
.ent .progress { grid-column: 2 / 4; }

/* ---------- issues ---------- */
.issue { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 14px; padding: 16px; border-top: 1px solid var(--line); }
.issue:first-of-type { border-top: 0; }
.issue__bar { border-radius: 4px; background: var(--critical); }
.issue--fixed .issue__bar { background: var(--success); }

          '<div class="run__meter"><span><b>' + fmt(moved) + '</b> of ' + fmt(h.records) + (full ? " moved" : " created") + (left ? ' · <b style="color:var(--critical)">' + fmt(left) + '</b> to fix' : "") + '</span>' +
            '<span class="run__bar" aria-hidden="true"><span style="width:' + pct + '%"></span>' + (left ? '<span style="width:' + Math.max(2, 100 - pct) + '%"></span>' : "") + '</span></div>' +
          '<div class="run__actions">' + (left ? '<button class="btn btn--primary btn--sm" type="button" data-go="results">Fix issues</button>' : "") + '<button class="btn btn--sm" type="button" data-go="' + target + '">View</button></div>' +
        '</div>';
      }).join("") + '</div>' +
      '<div class="runs__foot"><span>' + rows.length + (rows.length === 1 ? " run" : " runs") + ' · ' + fmt(rows.reduce(function (s, h) { return s + h.records; }, 0)) + ' records in total</span><button class="btn btn--plain btn--sm" type="button" data-act="toast" data-msg="Downloads history.csv">Download history (CSV)</button></div>';
    }
    return '<section class="card"><div class="card__sec row row--between"><div><h2 class="card__title">' + title + '</h2><p class="muted small">Newest first. Click a run to open it.</p></div></div>' + body + '</section>';
  }

  /* Overview strip: where data is moving from and to, plus the headline numbers. */
  function migrationOverview() {
    var full = S.history.filter(function (h) { return h.type === "full"; }).pop();
    var left = full ? issueCount() : 0;
    var demo = S.history.filter(function (h) { return h.type === "demo"; }).pop();
    var moved = full ? full.records - left : demo ? demo.records : 0;
    var last = S.history.length ? S.history[S.history.length - 1] : null;
    var arrow = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>';
    var bag = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h12l-1 10H5L4 7Z"/><path d="M7.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg>';
    return '<section class="card mg-over"><div class="mg-route">' +
        '<div class="rv-node"><i style="background:' + P().color + '">' + P().abbr + '</i><span><strong>' + src() + '</strong><small>' + P().version + '</small><small class="rv-ok">' + I.check + 'Connected, read-only</small></span></div>' +
        '<div class="welcome__path" aria-hidden="true"><span></span><span></span><span></span>' + arrow + '</div>' +
        '<div class="rv-node rv-node--to"><i class="rv-node__shop">' + bag + '</i><span><strong>Shopify</strong><small>' + SHOP + '</small><small class="rv-ok">' + I.check + 'Receiving</small></span></div>' +
      '</div><div class="mg-stats">' +
        '<div class="mg-stat"><span class="mg-stat__label">Runs</span><span class="mg-stat__value">' + S.history.length + '</span><span class="mg-stat__foot">' + S.history.filter(function (h) { return h.type === "demo"; }).length + ' demo · ' + S.history.filter(function (h) { return h.type === "full"; }).length + ' full</span></div>' +
        '<div class="mg-stat"><span class="mg-stat__label">Records in Shopify</span><span class="mg-stat__value">' + fmt(moved) + '</span><span class="mg-stat__foot">' + (full ? "of " + fmt(totalRecords()) + " found in your store" : demo ? "from the free demo" : fmt(totalRecords()) + " found, none moved yet") + '</span></div>' +
        '<div class="mg-stat"><span class="mg-stat__label">To fix</span><span class="mg-stat__value' + (left ? " mg-stat__value--bad" : full ? " mg-stat__value--ok" : "") + '">' + (full ? fmt(left) : "—") + '</span><span class="mg-stat__foot">' + (left ? "Each has a one-click fix" : full ? "All clear" : "After the full migration") + '</span></div>' +
        '<div class="mg-stat"><span class="mg-stat__label">Last finished</span><span class="mg-stat__value" style="font-size:17px">' + (last ? last.date : "—") + '</span><span class="mg-stat__foot">' + (last ? (last.type === "full" ? "Full migration" : "Free demo") + " #" + last.id : "No runs yet") + '</span></div>' +
      '</div></section>';
  }

  function pageMigrations() {
    var draft = S.draft && S.stage === 0;
    var running = S.run && !S.run.finished;
    var live = "";
    if (draft) {
      live = '<section class="card"><div class="live"><span class="live__icon live__icon--draft">' + I.plug + '</span>' +
        '<div class="live__title">Draft migration<span class="badge">Not started</span></div>' +
        '<button class="btn btn--primary btn--sm" type="button" data-act="new">Continue</button>' +
        '<div class="live__meter"><span>Step ' + S.wiz + ' of 3 · ' + ["Connect", "Choose what to move", "Review and start"][S.wiz - 1] + '</span></div></div></section>';
    } else if (running) {
      var cur = S.run.rows.find(function (r) { return r.done < r.total; });
      live = '<section class="card"><div class="live"><span class="live__icon">' + (S.run.type === "demo" ? I.spark : I.migrate) + '</span>' +
        '<div class="live__title">' + (S.run.type === "demo" ? "Free demo" : "Full migration") + ' #' + S.run.id + badge(S.paused ? "paused" : "running") + '</div>' +
        '<button class="btn btn--sm" type="button" data-go="progress">View progress</button>' +
        '<div class="live__meter"><div class="progress progress--thin"><span style="width:' + runPercent() + '%"></span></div><span class="num">' + runPercent() + '%</span><span>' + (S.paused ? "Paused" : cur ? "Moving " + cur.label.toLowerCase() : "Finishing") + '</span></div></div></section>';
    }
    var empty = '<section class="card"><div class="empty"><div class="empty__art">' + I.migrate + '</div><h2>No migrations yet</h2><p class="muted" style="max-width:46ch">Start with the free demo. It moves 20 of each type so you can check them in Shopify first.</p>' + newBtn() + '</div></section>';
    return '<div class="page">' + header("Migrations", S.connected ? "Every run from <strong>" + src() + "</strong> into Shopify, newest first." : "Connect a store to start your first migration.", planPill() + newBtn()) +
      (S.connected ? migrationOverview() : "") + live +
      (S.history.length ? historyCard("Run history") : (draft || running ? "" : empty)) + projectsCard() + '</div>';
  }

  /* ============ WIZARD ============ */
  function pageWizard() {
    var step = S.page === "progress" ? 4 : S.wiz;
    var run = S.run || S.lastRun;
    var labels = ["Connect", "Choose what to move", "Review and start", run && step === 4 && run.type === "full" ? "Full migration" : "Demo"];
    var stepper = '<ol class="stepper" aria-label="Steps">' + labels.map(function (l, i) {
      var n = i + 1; var st = n < step || (n === 4 && run && run.finished && step === 4) ? "done" : n === step ? "current" : "";
      return '<li class="' + st + '"' + (n === step ? ' aria-current="step"' : "") + '>' + n + '. ' + l + '</li>';
    }).join("") + '</ol>';

    if (step === 4) {
      var title = run ? (run.type === "demo" ? "Free demo" : "Full migration") + " #" + run.id + " " + (run.finished ? badge("done") : S.paused ? badge("paused") : badge("running")) : "Progress";
      return '<div class="page page--narrow">' + header(title, "From " + P().name + " · " + src() + " to " + SHOP, "", ["home", "Connector"]) +
        stepper + '<section class="card">' + progressBody(run) + '</section>' +
        (run && !run.finished ? '<div class="banner banner--info">' + I.info + '<div class="banner__body">You can close this page or leave the app. The migration keeps running on our servers.</div></div>' : "") + '</div>';
    }

    var body = S.wiz === 1 ? wizConnect() : S.wiz === 2 ? wizData() : wizReview();
    var nextDisabled = S.wiz === 1 && !S.connected;
    var footer = '<div class="footer-bar"><button class="btn btn--plain btn--plain-critical" type="button" data-act="discard">Discard draft</button><div class="row">' +
      (S.wiz > 1 ? '<button class="btn" type="button" data-act="wiz-back">Back</button>' : "") +
      (S.wiz < 3 ? '<button class="btn btn--primary" type="button" data-act="wiz-next"' + (nextDisabled ? " disabled" : "") + '>Continue</button>' : wizRunButtons()) + '</div></div>';

    return '<div class="page page--narrow">' + header("New migration <span class=\"badge\">Draft</span>", "Your choices are saved as you go. Leave any time and continue later.", "", ["home", "Connector"]) +
      stepper + '<section class="card">' + body + footer + '</section>' +
      '<p class="muted small row" style="justify-content:center">' + I.lock + 'Keys are encrypted. We only ever read from your old store.</p></div>';
  }

  function wizRunButtons() {
    if (!S.demoRun) {
      return '<button class="btn" type="button" data-act="' + (S.plan ? "confirm-full" : "need-plan") + '">' + (S.plan ? "Skip demo, begin full migration" : "Choose a plan") + '</button>' +
        '<button class="btn btn--primary" type="button" data-act="start-demo">' + I.spark + 'Run free demo</button>';
    }
    return S.plan ? '<button class="btn btn--primary" type="button" data-act="confirm-full">Begin full migration</button>'
      : '<button class="btn btn--primary" type="button" data-act="need-plan">Choose a plan</button>';
  }

  function wizConnect() {
    var tiles = Object.keys(PLAT).map(function (k) {
      var t = PLAT[k];
      return '<label class="tile"><input type="radio" name="platform" value="' + k + '"' + (S.platform === k ? " checked" : "") + '>' +
        '<span class="tile__logo" style="background:' + t.color + '">' + t.abbr + '</span><span class="tile__text"><span class="tile__name">' + t.name + '</span><span class="muted small">' + t.blurb + '</span></span></label>';
    }).join("") +
      '<label class="tile tile--off"><input type="radio" name="platform" disabled><span class="tile__logo" style="background:var(--subtle)">BC</span><span class="tile__text"><span class="tile__name">BigCommerce</span><span class="muted small">Coming soon</span></span></label>';

    var intro = '<div class="card__sec"><h2 class="wiz-title">Where are you moving from?</h2><p class="muted">' +
      (S.projects.length ? "Pick the platform of the store you want to move next." : "Pick your platform, then paste a read-only key.") + '</p></div>' +
      '<div class="card__sec"><div class="tiles" role="radiogroup" aria-label="Platform">' + tiles + '</div></div>';

    if (!S.platform) {
      return intro + '<div class="card__sec"><div class="scan__empty" style="min-height:120px"><div>' + I.store + '<p>Choose a platform above to continue.</p></div></div></div>';
    }

    var p = P();
    var scan = S.connected
      ? '<div class="muted small">Connection result</div><div class="ok">' + I.checkLg + 'Connected · ' + p.version + '</div><div class="muted small" style="margin-top:8px">We found:</div><ul>' +
        ENT.filter(function (e) { return e.count; }).map(function (e) { return '<li><span>' + e.label + '</span><strong>' + fmt(e.count) + '</strong></li>'; }).join("") + '</ul>'
      : S.testing
        ? '<div class="scan__empty"><div><span class="btn is-loading" style="box-shadow:none;background:none"></span><p>Connecting and counting your data…</p></div></div>'
        : '<div class="scan__empty"><div>' + I.store + '<p>Test the connection to see<br>what we find in your store.</p></div></div>';

    var fields = p.fields.map(function (f) {
      return '<div class="field"><label for="f-' + f[0] + '">' + f[1] + '</label><input class="input input--mono" id="f-' + f[0] + '" data-field="' + f[0] + '" type="password" autocomplete="off" value="' + (S.fields[f[0]] || "") + '"></div>';
    }).join("");

    return intro +
      '<div class="card__sec"><div class="grid2"><div class="stack">' +
      '<div class="field"><label for="f-url">' + (S.platform === "wordpress" ? "Site address" : "Store address") + '</label><input class="input" id="f-url" data-bind="url" type="url" placeholder="https://your-store.com" value="' + S.url + '"></div>' +
      fields +
      '<details class="howto"' + (S.connected ? "" : " open") + '><summary>' + I.info + (S.platform === "wordpress" ? "Do I need a password?" : "Where do I find " + (p.fields.length > 1 ? "these keys" : "this token") + "?") + '</summary><ol>' +
      p.howto.map(function (h) { return "<li>" + h + "</li>"; }).join("") + '</ol></details>' +
      '<div class="row"><button class="btn' + (S.connected ? "" : " btn--primary") + '" type="button" data-act="test">' + I.plug + (S.connected ? "Test again" : "Test connection") + '</button></div>' +
      '</div><div class="scan" aria-live="polite">' + scan + '</div></div></div>';
  }

  function wizData() {
    var rows = ENT.filter(function (e) { return e.count !== undefined; }).map(function (e) {
      var on = S.entities.indexOf(e.key) !== -1;
      var sub = SUB[e.key];
      var partial = on && sub && S.subs[e.key].length < sub.length;
      var row = '<label class="pick__main"><input type="checkbox" data-ent="' + e.key + '"' + (on ? " checked" : "") + (partial ? " data-partial" : "") + '><span class="pick__text"><span class="pick__name">' + e.label + '</span>' +
        (e.to ? ' <span class="muted small">' + (e.key === "collections" ? "→ " : "· ") + e.to + '</span>' : "") +
        (sub && on ? '<span class="pick__summary">' + subCount(e.key) + '</span>' : "") + '</span><span class="pick__count">' + (e.count === null ? "auto" : fmt(e.count)) + '</span></label>';
      if (!sub || !on) return '<div class="pick__row">' + row + '</div>';
      var subs = '<fieldset class="pick__sub"><legend class="visually-hidden">' + e.label + ' details</legend><div class="pick__subhead"><span>What to include</span>' +
        '<button class="btn btn--plain btn--sm" type="button" data-suball="' + e.key + '">' + (S.subs[e.key].length === sub.length ? "Only required" : "Select all") + '</button></div><div class="pick__grid">' +
        sub.map(function (s) {
          var checked = s[3] || S.subs[e.key].indexOf(s[0]) !== -1;
          return '<label class="check"><input type="checkbox" data-sub="' + e.key + ':' + s[0] + '"' + (checked ? " checked" : "") + (s[3] ? " disabled" : "") + '>' +
            '<span><span class="check__label">' + s[1] + '</span>' + (s[3] ? '<span class="help">Always included</span>' : s[2] ? '<span class="help">' + s[2] + '</span>' : "") + '</span></label>';
        }).join("") + '</div></fieldset>';
      return '<div class="pick__row pick__row--open">' + row + subs + '</div>';
    }).join("");
    return '<div class="card__sec"><h2 style="font-size:16px">What do you want to move?</h2><p class="muted">From <strong>' + src() + '</strong>. Everything is ticked; untick what you do not need.</p></div>' +
      '<div class="pick">' + rows + '</div>';
  }

  var ENT_ICON = {
    collections: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>',
    products: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 2 3 6v8l7 4 7-4V6l-7-4Z"/><path d="M3 6l7 4 7-4M10 10v8"/></svg>',
    customers: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17a6.5 6.5 0 0 1 13 0"/></svg>',
    orders: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 7h6M7 10h6M7 13h3"/></svg>',
    posts: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 8h14M7 12h6"/></svg>',
    redirects: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10h10M10 6l4 4-4 4"/><path d="M17 4v12"/></svg>'
  };
  /* Step 3 summary: where the data goes, three headline figures, and one tile per data type */
  function reviewSummary() {
    var ents = chosenEnt(), total = totalRecords(), max = Math.max.apply(null, [1].concat(ents.map(function (e) { return e.count || 0; })));
    var plan = !S.plan ? ["Free", '<span class="badge">Demo is free</span>', "Choose a plan before the full migration"]
      : planFits() ? [S.plan.name, '<span class="badge badge--success">Fits</span>', fmt(total) + " of " + (S.plan.limit === null ? "unlimited" : fmt(S.plan.limit)) + " records this month"]
      : [S.plan.name, '<span class="badge badge--critical">Over limit</span>', "Limit is " + fmt(S.plan.limit) + " records a month"];
    var arrow = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>';
    var bag = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h12l-1 10H5L4 7Z"/><path d="M7.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg>';
    var tiles = ents.map(function (e) {
      var n = e.count === null ? P().redirects : e.count;
      var hint = SUB[e.key] ? subCount(e.key) : e.key === "redirects" ? "old links sent to the new pages" : e.key === "collections" ? "become Shopify collections" : e.key === "orders" ? "with payment and fulfilment status" : "";
      return '<div class="rv-item"><span class="rv-item__icon">' + (ENT_ICON[e.key] || I.migrate) + '</span><span class="rv-item__name">' + e.label + (hint ? "<small>" + hint + "</small>" : "") + '</span><span class="rv-item__count num">' + fmt(n || 0) + '</span>' +
        '<span class="rv-item__bar" aria-hidden="true"><span style="width:' + Math.max(2, Math.round((e.count || 0) / max * 100)) + '%"></span></span></div>';
    }).join("");
    return '<div class="card__sec"><h2 style="font-size:16px">Review and run</h2><p class="muted">Check the summary, then run the free demo or begin the full migration.</p></div>' +
      '<div class="rv-route"><div class="rv-node"><i style="background:' + P().color + '">' + P().abbr + '</i><span><strong>' + P().name + '</strong><small>' + src() + '</small><small class="rv-ok">' + I.check + P().version + ' · connected</small></span></div>' +
        '<div class="welcome__path" aria-hidden="true"><span></span><span></span><span></span>' + arrow + '</div>' +
        '<div class="rv-node rv-node--to"><i class="rv-node__shop">' + bag + '</i><span><strong>Shopify</strong><small>' + SHOP + '</small><small>receives everything below</small></span></div></div>' +
      '<div class="rv-stats">' +
        '<div class="rv-stat"><span class="rv-stat__label">Records to move</span><span class="rv-stat__value num">' + fmt(total) + '</span><span class="rv-stat__foot">across ' + ents.length + ' data types</span></div>' +
        '<div class="rv-stat"><span class="rv-stat__label">Plan</span><span class="rv-stat__value">' + plan[0] + plan[1] + '</span><span class="rv-stat__foot">' + plan[2] + '</span></div></div>' +
      '<div class="rv-head"><span>What moves</span><button class="btn btn--plain btn--sm" type="button" data-act="wiz-back">Change</button></div><div class="rv-data">' + tiles + '</div>' +
      (!S.demoRun ? '<div class="banner banner--brand rv-demo">' + I.spark + '<div class="banner__body"><strong>Start with the free demo.</strong> It moves 20 of each type (' + fmt(demoTotal()) + ' records) into Shopify so you can check them first. It never counts against your plan.</div></div>' : "");
  }
  var SHOW_ADVANCED = false;
  function wizReview() {
    var has = function (k) { return S.entities.indexOf(k) !== -1; };
    var fits = !S.plan ? '<span class="badge">Demo is free</span>' : planFits() ? '<span class="badge badge--success">Fits your ' + S.plan.name + ' plan</span>' : '<span class="badge badge--critical">Over your plan limit</span>';
    var mapRows = statuses().map(function (s) {
      return '<tr><td><code>' + s.key + '</code> <span class="muted small num">' + fmt(s.count) + '</span></td><td><select class="select" aria-label="' + s.key + ' payment"><option>' + s.pay + '</option><option>Paid</option><option>Pending</option><option>Refunded</option><option>Voided</option></select></td>' +
        '<td><select class="select" aria-label="' + s.key + ' fulfilment"><option>' + s.ful + '</option><option>Fulfilled</option><option>Unfulfilled</option></select></td></tr>';
    }).join("");
    /* Advanced options are hidden for now; set SHOW_ADVANCED to true to bring the section back. */
    var advanced = '<details class="adv card__sec" style="padding:0"><summary>Advanced options <span class="row muted small" style="font-weight:500">Defaults suit most stores ' + I.chev + '</span></summary>' +
      '<div class="opt-grid">' +
      (has("products") ? '<div class="opt"><span class="opt__label">Product status in Shopify</span><div class="radios"><label><input type="radio" name="ps" checked>Same as old store</label><label><input type="radio" name="ps">All as draft</label></div></div>' +
      '<div class="opt"><span class="opt__label">If the same product code (SKU) is already in Shopify</span><div class="radios"><label><input type="radio" name="sku" checked>Skip it</label><label><input type="radio" name="sku">Update it</label></div></div>' : "") +
      (has("posts") ? '<div class="opt"><span class="opt__label">Blog posts</span><div class="radios"><label><input type="radio" name="pv" checked>Same visibility as old site</label><label><input type="radio" name="pv">All hidden</label></div></div>' : "") +
      (has("customers") ? '<div class="opt"><span class="opt__label">Customers</span><label class="check"><input type="checkbox"><span><span class="check__label">Send account invite emails</span><span class="help">Passwords cannot be moved, so customers set a new one.</span></span></label></div>' : "") +
      (has("orders") ? '<div class="opt"><span class="opt__label">Orders</span><label class="check"><input type="checkbox" checked><span>Keep original order numbers</span></label><label class="check"><input type="checkbox" checked><span>Do not email customers about imported orders</span></label></div>' : "") +
      '</div>' +
      (has("orders") && mapRows ? '<div style="padding:0 16px 16px"><div class="opt__label" style="margin-bottom:6px">How order statuses carry over <span class="muted small" style="font-weight:500">only statuses found in your store</span></div>' +
      '<div class="table-wrap card" style="box-shadow:inset 0 0 0 1px var(--line)"><table><thead><tr><th>' + P().name + '</th><th>Payment</th><th>Fulfilment</th></tr></thead><tbody>' + mapRows + '</tbody></table></div></div>' : "") + '</details>';
    return reviewSummary() + (SHOW_ADVANCED ? advanced : "");
  }

  /* ============ PROGRESS ============ */
  function runPercent() {
    if (!S.run) return 0;
    var t = 0, d = 0; S.run.rows.forEach(function (r) { t += r.total; d += r.done; });
    return t ? Math.floor(d / t * 100) : 100;
  }
  /* Step 4 of the wizard: live progress, then the result with what to do next. */
  function progressBody(r) {
    if (!r) return '<div class="empty"><div class="empty__art">' + I.migrate + '</div><h2>Nothing is running</h2><p class="muted">Start a demo or a full migration from Connector.</p><button class="btn btn--primary" type="button" data-go="home">Go to Home</button></div>';
    var t = 0, d = 0; r.rows.forEach(function (x) { t += x.total; d += x.done; });
    var p = t ? Math.floor(d / t * 100) : 100, fin = r.finished;
    var firstOpen = r.rows.findIndex(function (x) { return x.done < x.total; });
    var list = r.rows.map(function (x, i) {
      var st = x.done >= x.total ? "done" : i === firstOpen ? "active" : "wait";
