      var vals = bs.map(function (b) { return b.v.moved; }), mx = Math.max.apply(null, vals) || 1, sw = 96, sh = 28;
      var pts = vals.map(function (v, i) { return [(i / Math.max(1, vals.length - 1)) * (sw - 6) + 3, sh - 3 - (v / mx) * (sh - 6)]; });
      sp.innerHTML = '<svg width="' + sw + '" height="' + sh + '" aria-hidden="true"><polyline fill="none" stroke="var(--subtle)" stroke-width="1.5" stroke-linejoin="round" points="' + pts.map(function (p) { return p.join(","); }).join(" ") + '"/>' +
        '<circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="3" fill="var(--brand)" stroke="var(--surface)" stroke-width="1.5"/></svg>';
    }

    drawStackChart();

    /* by data type: one bar per type, value at the tip */
    var cur = sumDays(R - 1, 0), tmax = Math.max(1, cur.products, cur.customers, cur.orders, cur.other);
    document.getElementById("ch-types").innerHTML = TYPES.map(function (t) {
      var v = cur[t[0]], pct = cur.moved ? (v / cur.moved * 100).toFixed(1) : "0";
      return '<div class="hbar" data-tip="' + t[1] + ': ' + fmt(v) + ' (' + pct + '% of all records)"><span>' + t[1].replace(" and posts", "") + '</span><div class="hbar__track"><div class="hbar__fill" style="width:' + (v / tmax * 100) + '%;background:var(' + t[2] + ')"></div></div><span class="hbar__val">' + compact(v) + '</span></div>';
    }).join("");

    /* by store: always both stores, so the split is visible even when one is filtered */
    var keep = S.dash.store, perStore = ["oak", "bright"].map(function (s) { S.dash.store = s; var v = sumDays(R - 1, 0).moved; return [s, v]; });
    S.dash.store = keep;
    var smax = Math.max(1, perStore[0][1], perStore[1][1]);
    document.getElementById("ch-stores").innerHTML = perStore.map(function (p) {
      var dim = keep !== "all" && keep !== p[0];
      return '<div class="hbar" style="' + (dim ? "opacity:.45" : "") + '" data-tip="' + DSTORES[p[0]].host + ' (' + DSTORES[p[0]].name + '): ' + fmt(p[1]) + ' records"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + DSTORES[p[0]].host.split(".")[0] + '</span>' +
        '<div class="hbar__track"><div class="hbar__fill" style="width:' + (p[1] / smax * 100) + '%;background:var(--brand)"></div></div><span class="hbar__val">' + compact(p[1]) + '</span></div>';
    }).join("");

    /* health: one 100% bar in status colours, each part labelled */
    var open = (S.dash.store !== "oak" && R >= 20) ? 37 : 0, fixed = Math.max(0, cur.failed - open), all = cur.moved + open || 1;
    var parts = [["Moved first time", cur.moved - fixed, "var(--success)"], ["Fixed afterwards", fixed, "var(--info)"], ["Needs attention", open, "var(--critical)"]];
    document.getElementById("ch-health").innerHTML = '<div class="health">' + parts.filter(function (p) { return p[1] > 0; }).map(function (p) {
      return '<span style="flex:' + Math.max(p[1] / all, 0.012) + ';background:' + p[2] + '" data-tip="' + p[0] + ': ' + fmt(p[1]) + '"></span>';
    }).join("") + '</div><div class="health-keys">' + parts.map(function (p) {
      return '<div><strong>' + fmt(p[1]) + '</strong><span><i style="background:' + p[2] + '"></i>' + p[0] + '</span></div>';
    }).join("") + '</div>';

    /* open issues by cause */
    var iss = open ? ISSUES : [];
    var imax = Math.max.apply(null, [1].concat(iss.map(function (i) { return i.count; })));
    document.getElementById("ch-issues").innerHTML = iss.length ? iss.map(function (i) {
      var short = { opts: "Too many options", phone: "Phone format", img: "Missing image", orders: "Deleted product" }[i.id];
      return '<div class="hbar" data-tip="' + i.title.replace(/"/g, "") + '"><span>' + short + '</span><div class="hbar__track"><div class="hbar__fill" style="width:' + (i.count / imax * 100) + '%;background:var(--s2)"></div></div><span class="hbar__val">' + i.count + '</span></div>';
    }).join("") : '<p class="muted" style="padding:0 0 4px">No open issues for this selection.</p>';

    /* recent activity */
    var kinds = { demo: ["Free demo finished", "spark", ""], full: ["Full migration finished", "checkLg", "ok"], sync: ["Changes synced", "migrate", ""], rerun: ["Extra products moved", "plus", ""] };
    var feed = DASH.events.filter(function (e) { return e.ago < R && !e.part && (S.dash.store === "all" || S.dash.store === e.s); }).sort(function (a, b) { return a.ago - b.ago; });
    document.getElementById("feed").innerHTML = feed.length ? feed.map(function (e) {
      var k = kinds[e.kind], n = e.kind === "full" ? DASH.events.filter(function (o) { return o.s === e.s && o.kind === "full"; }).reduce(function (s, o) { return s + o.n; }, 0) : e.n;
      var warn = e.failed && e.fixed < e.failed;
      return '<li><span class="feed__icon' + (warn ? " feed__icon--warn" : k[2] ? " feed__icon--" + k[2] : "") + '">' + (warn ? I.alert : I[k[1]]) + '</span><div class="feed__text"><strong>' + k[0] + '</strong> · ' + DSTORES[e.s].host +
        '<div class="muted small">' + fmt(n) + ' records' + (e.failed ? " · " + (e.failed - (e.fixed || 0)) + " need attention" : "") + '</div></div><span class="feed__time">' + (e.ago === 0 ? "Today" : e.ago === 1 ? "Yesterday" : dayLabel(e.ago)) + '</span></li>';
    }).join("") : '<li><span></span><span class="muted">No activity in this period.</span><span></span></li>';

    /* simple tooltips for HTML bars */
    main.querySelectorAll("[data-tip]").forEach(function (el) {
      el.addEventListener("mousemove", function (ev) { tip(el.dataset.tip, ev); });
      el.addEventListener("mouseleave", function () { tip(null); });
    });
  }

  /* ---------- render ---------- */
  var PAGES = { home: pageHome, dashboard: pageDashboard, wizard: pageWizard, progress: pageWizard, demo: pageDemo, results: pageResults, migrations: pageMigrations, settings: pageSettings, plans: pagePlans, help: pageHelp };
  var main = document.getElementById("main");

  function render() {
    main.innerHTML = appTabs() + PAGES[S.page]();
    main.querySelectorAll("[data-partial]").forEach(function (el) { el.indeterminate = true; });
    if (S.page === "dashboard") drawDashboard();
    var cur = navKey();
    document.getElementById("sidenav").innerHTML = [["dashboard", "Dashboard"], ["home", "Connector"], ["migrations", "Migrations"], ["settings", "Settings"], ["plans", "Plans"], ["help", "Help"]].map(function (p) {
      return '<button class="side__link" type="button" data-go="' + p[0] + '"' + (cur === p[0] ? ' aria-current="page"' : "") + '>' + p[1] + '</button>';
    }).join("");
    var sel = document.getElementById("proto-stage");
    if (sel) {
      sel.innerHTML = STAGES.map(function (t, i) { return '<option value="' + i + '"' + (i === S.stage ? " selected" : "") + '>' + (i + 1) + ". " + t + '</option>'; }).join("");
    }
  }
  function go(page) { tip(null); S.page = page; render(); window.scrollTo(0, 0); }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  var modalConfirm = null;
  function modal(o) {
    modalConfirm = o.onConfirm;
    document.getElementById("modal").innerHTML = '<div class="overlay" data-act="modal-close"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dialog__head" id="dlg-t">' + o.title + '</div><div class="dialog__body">' + o.body + '</div>' +
      '<div class="dialog__foot"><button class="btn" type="button" data-act="modal-close">' + (o.cancel || "Cancel") + '</button><button class="btn ' + (o.destructive ? "btn--critical" : "btn--primary") + '" type="button" data-act="modal-ok">' + o.ok + '</button></div></div></div>';
    document.querySelector("[data-act=modal-ok]").focus();
  }
  function closeModal() { document.getElementById("modal").innerHTML = ""; modalConfirm = null; }
  /* A dialog of large, described options instead of OK / Cancel. */
  function modalChoice(title, options) {
    modalConfirm = function () {};
    document.getElementById("modal").innerHTML = '<div class="overlay" data-act="modal-close"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dialog__head" id="dlg-t">' + title + '</div><div class="dialog__body">' +
      options.map(function (o) {
        return '<button class="choice' + (o.primary ? " choice--primary" : "") + '" type="button" data-act="' + o.act + '"><span class="choice__title">' + o.title + '</span><span class="choice__body">' + o.body + '</span></button>';
      }).join("") + '</div><div class="dialog__foot"><button class="btn" type="button" data-act="modal-close">Cancel</button></div></div></div>';
    (document.querySelector(".choice--primary") || document.querySelector(".choice")).focus();
  }

  /* ---------- run simulation ---------- */
  var nextId = 11, timer = null;
  function startRun(type) {
    var rows = chosenEnt().map(function (e) {
      var total = e.count === null ? (type === "demo" ? 20 : P().redirects) : (type === "demo" ? Math.min(20, e.count) : e.count);
      return { label: e.label, total: total, done: 0, ticks: type === "demo" ? 4 : 14 };
    });
    S.run = { type: type, id: nextId++, rows: rows, finished: false };
    S.paused = false;
    clearInterval(timer);
    timer = setInterval(tick, 130);
    go("progress");
  }
  function tick() {
    if (S.paused || !S.run) return;
    var row = S.run.rows.find(function (r) { return r.done < r.total; });
    if (!row) return finishRun();
    row.done = Math.min(row.total, row.done + Math.max(1, Math.ceil(row.total / row.ticks)));
    if (S.page === "progress" || S.page === "home" || S.page === "migrations") render();
  }
  function finishRun() {
    clearInterval(timer);
    var r = S.run; r.finished = true;
    var records = r.rows.reduce(function (s, x) { return s + (x.label === "Old page links" ? 0 : x.total); }, 0);
    var d = new Date();
    S.history.push({ id: r.id, type: r.type, records: r.type === "demo" ? demoTotal() : records, date: d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" }) + ", " + d.toTimeString().slice(0, 5) });
    if (r.type === "demo") { S.demoRun = true; S.stage = Math.max(S.stage, 2); toast("Demo finished. Check it in Shopify."); }
    else { S.fixed = []; S.stage = Math.max(S.stage, 5); toast("Full migration finished"); }
    S.lastRun = r; S.run = null;
    render();
  }

  /* ---------- prototype stage jump ---------- */
  function jump(stage) {
    clearInterval(timer);
    S = initial();
    S.stage = stage;
    if (stage >= 1) { S.connected = true; S.draft = false; S.wiz = 3; }
    if (stage >= 2) { S.demoRun = true; S.history.push({ id: 10, type: "demo", records: demoTotal(), date: "8 Oct, 10:42" }); }
    if (stage >= 4) S.plan = { id: "growth", name: "Growth", limit: 25000 };
    if (stage >= 5) S.history.push({ id: 11, type: "full", records: totalRecords(), date: "8 Oct, 11:31" });
    if (stage >= 6) S.fixed = ISSUES.map(function (i) { return i.id; });
    if (stage >= 7) S.syncState = "done";
    nextId = 12;
    go("home");
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-go],[data-act],[data-fix],[data-plan],[data-tab],[data-suball],[data-range],[data-view]");
    if (!el) return;
    if (el.dataset.go) { if (el.closest("[data-act=modal-close]")) closeModal(); return go(el.dataset.go); }
    if (el.dataset.tab) { S.demoTab = el.dataset.tab; return render(); }
    if (el.dataset.range) { S.dash.range = Number(el.dataset.range); return render(); }
    if (el.dataset.view) { S.dash.view = el.dataset.view; return swapDashView(); }
    if (el.dataset.suball) {
      var sk = el.dataset.suball, everything = S.subs[sk].length === SUB[sk].length;
      S.subs[sk] = SUB[sk].filter(function (s) { return !everything || s[3]; }).map(function (s) { return s[0]; });
      return render();
    }
    if (el.dataset.plan) {
      var p = { starter: { id: "starter", name: "Starter", limit: 2500 }, growth: { id: "growth", name: "Growth", limit: 25000 }, pro: { id: "pro", name: "Pro", limit: null } }[el.dataset.plan];
      return modal({ title: "Approve the " + p.name + " plan", body: "<p>In the real app, Shopify shows its own approval screen here and the charge is added to your Shopify bill.</p>", ok: "Approve", onConfirm: function () {
        S.plan = p; if (S.stage === 3) S.stage = 4; toast(p.name + " plan is active"); go("home");
      } });
    }
    if (el.dataset.fix) {
      var id = el.dataset.fix; el.classList.add("is-loading");
      return setTimeout(function () { S.fixed.push(id); toast("Fixed"); render(); }, 900);
    }
    var a = el.dataset.act;
    if (a === "modal-close") { if (ev.target === el || el.tagName === "BUTTON") closeModal(); return; }
    if (a === "modal-ok") { var fn = modalConfirm; closeModal(); if (fn) fn(); return; }
    if (a === "reset") { clearInterval(timer); S = initial(); nextId = 11; return go("home"); }
    if (a === "new") {
      if (S.connected && !(S.draft && S.stage <= 1)) return newChoice();
      S.draft = true; return go("wizard");
    }
    if (a === "choice-new") { closeModal(); return startNewStore(); }
    if (a === "choice-same") {
      closeModal();
      if (S.stage >= 5) { S.draft = true; S.wiz = 2; return go("wizard"); }
      return go("home");
    }
    if (a === "open-wizard") { S.wiz = Number(el.dataset.step); return go("wizard"); }
    if (a === "wiz-back") { S.wiz--; return render(); }
    if (a === "wiz-next") { S.wiz++; return render(); }
    if (a === "discard") {
      return modal({ title: "Discard this draft?", body: "<p>Nothing has been migrated yet, so nothing is lost. Your store connection is kept.</p>", ok: "Discard", destructive: true, onConfirm: function () { S.draft = false; S.wiz = S.connected ? 2 : 1; go("home"); } });
    }
    if (a === "test") {
      if (!S.platform) return toast("Choose a platform first");
      if (!S.url.trim()) return toast("Enter your store address first");
      S.testing = true; S.connected = false; render();
      return setTimeout(function () { S.testing = false; S.connected = true; S.entities = available(); if (S.stage === 0) S.stage = 1; toast("Connected to " + src()); render(); }, 1200);
    }
    if (a === "start-demo") { S.stage = Math.max(S.stage, 1); S.draft = false; return startRun("demo"); }
    if (a === "demo-ok") { S.stage = Math.max(S.stage, 3); toast("Demo approved"); return go(S.plan ? "home" : "plans"); }
    if (a === "need-plan") { toast("Choose a plan to run the full migration"); return go("plans"); }
    if (a === "confirm-full") {
      if (!S.plan) { toast("Choose a plan first"); return go("plans"); }
      return modal({ title: "Begin the full migration?", body: "<p><strong>" + fmt(totalRecords()) + " records</strong> will be created in " + SHOP + ".</p><p class=\"muted\">It runs in the background and takes " + eta(totalRecords()) + ". You can close the page.</p>", ok: "Begin migration", onConfirm: function () { S.stage = 4; S.draft = false; startRun("full"); } });
    }
    if (a === "pause") { S.paused = !S.paused; toast(S.paused ? "Paused" : "Resumed"); return render(); }
    if (a === "cancel") {
      return modal({ title: "Cancel this migration?", body: "<p>Records already created stay in Shopify. You can start again later and we skip anything that is already there.</p>", ok: "Cancel migration", cancel: "Keep running", destructive: true, onConfirm: function () {
        clearInterval(timer); var t = S.run.type; S.run = null; S.stage = t === "demo" ? 1 : 4; toast("Migration cancelled"); go("home");
      } });
    }
    if (a === "notify") { S.notify = el.checked; return; }
    if (a === "delete-demo") {
      return modal({ title: "Delete the demo data?", body: "<p>This removes the " + fmt(demoTotal()) + " demo records from " + SHOP + ". Your old store is not touched.</p>", ok: "Delete demo data", destructive: true, onConfirm: function () {
        S.demoRun = false; S.history = S.history.filter(function (h) { return h.type !== "demo"; }); S.stage = Math.min(S.stage, 1); toast("Demo data deleted"); go("home");
      } });
    }
    if (a === "to-sync") { S.stage = Math.max(S.stage, 6); return go("home"); }
    if (a === "sync") { S.syncState = "running"; render(); return setTimeout(function () { S.syncState = "done"; toast("Sync finished"); render(); }, 1800); }
    if (a === "finish") { S.stage = 7; toast("Migration complete"); return go("home"); }
    if (a === "disconnect") {
      return modal({ title: "Disconnect " + src() + "?", body: "<p>Your saved keys are deleted. Data already in Shopify stays.</p>", ok: "Disconnect", destructive: true, onConfirm: function () { S.connected = false; toast("Disconnected"); render(); } });
    }
    if (a === "help-cat") { HELP.cat = el.dataset.cat; return refreshHelp(); }
    if (a === "help-topic") { HELP.cat = HELP.cat === el.dataset.cat ? "all" : el.dataset.cat; refreshHelp(); return document.getElementById("hp-faq").scrollIntoView({ behavior: "smooth", block: "start" }); }
    if (a === "help-plat") { HELP.plat = el.dataset.plat; return render(); }
    if (a === "admin-link") return toast("In the app this opens " + el.dataset.label + " in Shopify Admin");
    if (a === "toast") return toast(el.dataset.msg);
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "proto-stage") return jump(Number(t.value));
    if (t.name === "platform") {
      /* Sample address and key are filled in so the prototype can be clicked straight through. */
      S.platform = t.value; S.connected = false; S.url = "https://" + P().host; S.fields = sampleFields(t.value); S.entities = available();
      return render();
    }
    if (t.id === "dash-store") { S.dash.store = t.value; return render(); }
    if (t.dataset.sub) {
      var parts = t.dataset.sub.split(":"), list = S.subs[parts[0]], at = list.indexOf(parts[1]);
      if (t.checked && at === -1) list.push(parts[1]); else if (!t.checked && at !== -1) list.splice(at, 1);
      return render();
    }
    if (t.dataset.ent) {
      var k = t.dataset.ent, on = t.checked;
      /* a half-ticked parent fills in its details instead of switching off */
      if (!on && t.hasAttribute("data-partial")) { S.subs[k] = allSubs()[k]; return render(); }
      var add = function (x) { if (S.entities.indexOf(x) === -1) S.entities.push(x); };
      var rem = function (x) { var j = S.entities.indexOf(x); if (j !== -1) S.entities.splice(j, 1); };
      if (on) { add(k); if (k === "orders") { add("products"); add("customers"); } }
      else { rem(k); if ((k === "products" || k === "customers") && S.entities.indexOf("orders") !== -1) { rem("orders"); toast("Orders need products and customers, so Orders was unticked too"); } }
      return render();
    }
  });
  document.addEventListener("input", function (ev) { var d = ev.target.dataset || {}; if (d.bind) S[d.bind] = ev.target.value; if (d.field) S.fields[d.field] = ev.target.value; });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && modalConfirm !== null) closeModal();
    if (ev.key === "Enter" && ev.target.matches("tr[data-go], .run[data-go]")) go(ev.target.dataset.go);
  });

  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (S.page === "dashboard") drawDashboard(); }, 120); });

  render();

  /* First visit: let the dashboard show, then a welcome dialog invites them to connect their old store. "Connect store" opens Home, where the journey starts. */
  function welcomeDialog() {
    if (S.connected || modalConfirm !== null) return;
    modalConfirm = function () { go("home"); };
    var arrow = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>';
    var bag = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h12l-1 10H5L4 7Z"/><path d="M7.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg>';
    var clock = '<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 1.5"/></svg>';
    var point = function (strong, rest) { return '<li><span>' + I.check + '</span><span><strong>' + strong + '</strong> ' + rest + '</span></li>'; };
    document.getElementById("modal").innerHTML = '<div class="overlay overlay--welcome" data-act="modal-close"><div class="dialog welcome" role="dialog" aria-modal="true" aria-labelledby="dlg-t">' +
      '<div class="welcome__hero"><span class="badge badge--brand welcome__step">Step 1 of 4</span><div class="welcome__flow">' +
        '<div class="welcome__node"><i>' + I.store + '</i><span><strong>Your old store</strong><small>WooCommerce, Magento or WordPress</small></span></div>' +
        '<div class="welcome__path" aria-hidden="true"><span></span><span></span><span></span>' + arrow + '</div>' +
        '<div class="welcome__node welcome__node--shopify"><i>' + bag + '</i><span><strong>Shopify</strong><small>' + SHOP + '</small></span></div>' +
      '</div></div>' +
      '<div class="welcome__body"><h2 id="dlg-t">Connect your store to get started</h2>' +
        '<p>Move your products, customers, orders and content into Shopify. Connecting takes about two minutes, and the dashboard fills in as records arrive.</p>' +
        '<ul class="welcome__points">' +
          point("Your old store is never changed.", "We only read from it.") +
          point("Try a free demo first.", "20 records of each type, so you can check the result.") +
          point("Pause or stop at any time.", "Everything already moved stays in Shopify.") +
        '</ul>' +
        '<div class="welcome__plats">Works with <span class="badge">WooCommerce</span><span class="badge">Magento</span><span class="badge">WordPress</span></div>' +
      '</div>' +
      '<div class="welcome__foot"><button class="btn" type="button" data-act="modal-close">Explore the dashboard first</button>' +
        '<button class="btn btn--primary" type="button" data-act="modal-ok">Connect store ' + arrow.replace("<svg ", '<svg width="16" height="16" ') + '</button></div>' +
      '</div></div>';
    document.querySelector("[data-act=modal-ok]").focus();
  }
  setTimeout(welcomeDialog, 900);
})();
</script>

</html>
